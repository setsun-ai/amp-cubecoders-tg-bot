<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Dota 2 i instancje AMP — panel w Telegramie">
  <title>AMP • Dota Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-symbol"><span>◈</span></div>
      <div class="brand-copy"><div class="eyebrow">TELEGRAM MINI APP</div><div class="brand">AMP <span class="dot">•</span> DOTA HUB</div></div>
      <button class="icon-btn" id="reload" title="Odśwież" aria-label="Odśwież dane">↻</button>
    </header>
    <div class="connection" id="connection" role="status"><span class="connection-dot"></span><span data-t="connecting">Łączenie z botem…</span></div>
    <main id="app" aria-live="polite"><div class="loading"><div class="spinner"></div><p data-t="loading_panel">Wczytywanie panelu</p></div></main>
    <nav class="bottomnav" aria-label="Nawigacja główna" id="bottomnav">
      <button data-tab="dota" class="nav-btn active"><span class="nav-icon">✦</span><span data-t="nav_dota">Dota 2</span></button>
      <button data-tab="amp" class="nav-btn"><span class="nav-icon">▣</span><span data-t="nav_amp">Serwery AMP</span></button>
    </nav>
  </div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
